<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; }
    html, body { width:100%; height:100%; margin:0; padding:0; font-family:Arial,sans-serif; background:#2b2b2b; color:#f0f0f0; overflow:hidden; }
    .runner { display:flex; flex-direction:column; width:100%; height:100vh; min-height:300px; padding:10px; gap:7px; }
    .header { display:flex; align-items:center; justify-content:space-between; flex:0 0 34px; min-height:34px; }
    .brand { min-width:0; }
    .title { font-size:15px; font-weight:bold; letter-spacing:.4px; }
    .version { margin-top:2px; font-size:10px; color:#aaa; }
    .header-right { display:flex; align-items:center; gap:7px; min-width:0; }
    .update-status { font-size:10px; color:#aaa; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:120px; }
    #bellButton { position:relative; width:32px; height:30px; padding:0; font-size:16px; flex:0 0 32px; }
    #bellDot { display:none; position:absolute; right:4px; top:3px; width:8px; height:8px; border-radius:50%; background:#e5484d; border:1px solid #2b2b2b; }
    #bellButton.unread #bellDot { display:block; }
    .editor-wrap { display:flex; flex:1 1 auto; min-height:80px; width:100%; }
    #codeInput { width:100%; height:100%; min-height:80px; resize:none; padding:9px; border:1px solid #555; border-radius:5px; background:#1e1e1e; color:#f2f2f2; font-family:Consolas,"Courier New",monospace; font-size:12px; line-height:1.4; outline:none; }
    #codeInput:focus { border-color:#8b8b8b; }
    .actions { display:flex; width:100%; flex:0 0 32px; }
    button { height:32px; border:1px solid #555; border-radius:5px; background:#3b3b3b; color:#f0f0f0; padding:0 9px; cursor:pointer; }
    button:hover { background:#474747; }
    button:disabled { opacity:.55; cursor:default; }
    #runButton { flex:1 1 auto; font-weight:bold; background:#505050; margin-right:7px; }
    #clearButton { width:78px; flex:0 0 78px; }
    .options { display:flex; align-items:center; flex:0 0 20px; min-height:20px; font-size:11px; color:#c7c7c7; }
    .options label { display:flex; align-items:center; white-space:nowrap; }
    .options input { margin-right:5px; }
    .status { display:flex; align-items:center; justify-content:space-between; flex:0 0 28px; min-height:28px; padding:5px 7px; border:1px solid #444; border-radius:5px; background:#242424; font-size:11px; }
    #statusText { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .shortcut { color:#8f8f8f; white-space:nowrap; margin-left:7px; }
    .bottom { display:flex; flex:0 0 32px; width:100%; gap:6px; }
    .bottom button { flex:1 1 0; min-width:0; padding:0 4px; font-size:10px; }
    #saveFavoriteButton { background:#66511f; } #favoritesButton { background:#244f67; } #historyButton { background:#5b365f; } #updateButton { background:#285b3b; }
    #notificationCard { display:none; flex:0 0 auto; padding:8px; border:1px solid #555; border-radius:5px; background:#242424; font-size:11px; }
    #notificationCard.visible { display:block; }
    .notice-title { font-weight:bold; margin-bottom:5px; }
    .notice-actions { display:flex; gap:6px; margin-top:7px; }
    .notice-actions button { flex:1; height:28px; font-size:10px; }
  </style>
</head>
<body>
  <div class="runner">
    <div class="header">
      <div class="brand"><div class="title">TALHA RUNNER</div><div class="version" id="versionText">V2</div></div>
      <div class="header-right"><div class="update-status" id="updateStatus">● Başlatılıyor</div><button id="bellButton" title="Bildirimler">🔔<span id="bellDot"></span></button></div>
    </div>
    <div id="notificationCard">
      <div class="notice-title" id="notificationTitle">Bildirim yok</div>
      <div id="notificationSummary"></div>
      <div class="notice-actions"><button id="detailsButton">Detaylar</button><button id="skipButton">Bu sürümü atla</button></div>
    </div>
    <div class="editor-wrap"><textarea id="codeInput" spellcheck="false" placeholder="Yapay zekâdan aldığın InDesign kodunu buraya yapıştır..."></textarea></div>
    <div class="actions"><button id="runButton">▶ ÇALIŞTIR</button><button id="clearButton">Temizle</button></div>
    <div class="options"><label><input id="clearAfterRun" type="checkbox">Çalıştırınca kodu temizle</label></div>
    <div class="status"><span id="statusText">Başlatılıyor...</span><span class="shortcut">Ctrl + Enter</span></div>
    <div class="bottom"><button id="saveFavoriteButton">★ Kaydet</button><button id="favoritesButton">★ Favoriler</button><button id="historyButton">Geçmiş</button><button id="updateButton">Güncelle</button></div>
  </div>
  <script src="main.js"></script>
</body>
</html>
