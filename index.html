<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; padding: 0; font-family: Arial, sans-serif; }
    body { background: #2b2b2b; color: #f0f0f0; overflow: auto; }
    .runner { display: flex; flex-direction: column; width: 100%; min-height: 100%; padding: 12px; }
    .header { display: flex; flex-direction: row; align-items: center; justify-content: space-between; min-height: 34px; margin-bottom: 10px; }
    .brand { display: flex; flex-direction: column; min-width: 0; }
    .title { font-size: 15px; font-weight: bold; letter-spacing: 0.4px; }
    .version { margin-top: 2px; font-size: 10px; color: #9e9e9e; }
    .update-status { font-size: 10px; color: #a8a8a8; white-space: nowrap; }
    .editor-wrap { display: flex; width: 100%; height: 360px; min-height: 120px; margin-bottom: 10px; }
    #codeInput { width: 100%; height: 100%; min-height: 120px; resize: none; padding: 10px; border: 1px solid #555; border-radius: 5px; background: #1e1e1e; color: #f2f2f2; font-family: Consolas, "Courier New", monospace; font-size: 12px; line-height: 1.45; outline: none; }
    #codeInput:focus { border-color: #8b8b8b; }
    .actions { display: flex; flex-direction: row; width: 100%; margin-bottom: 8px; }
    button { height: 32px; border: 1px solid #555; border-radius: 5px; background: #3b3b3b; color: #f0f0f0; padding: 0 12px; cursor: pointer; }
    button:hover { background: #474747; }
    button:disabled { opacity: 0.55; cursor: default; }
    #runButton { flex: 1 1 auto; font-weight: bold; background: #505050; margin-right: 8px; }
    #clearButton { width: 82px; flex: 0 0 82px; }
    .options { display: flex; align-items: center; min-height: 22px; margin-bottom: 8px; font-size: 11px; color: #c7c7c7; }
    .options label { display: flex; flex-direction: row; align-items: center; flex-wrap: nowrap; }
    .options input { margin-right: 6px; }
    .status { display: flex; flex-direction: row; align-items: center; justify-content: space-between; min-height: 28px; padding: 6px 8px; margin-bottom: 8px; border: 1px solid #444; border-radius: 5px; background: #242424; font-size: 11px; }
    #statusText { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .shortcut { color: #8f8f8f; white-space: nowrap; margin-left: 8px; }
    .bottom { display: flex; flex-direction: row; flex-wrap: wrap; width: 100%; margin-bottom: 2px; }
    .bottom button { width: calc(50% - 4px); min-width: 0; margin-bottom: 8px; font-size: 11px; padding: 0 6px; }
    .bottom button:nth-child(odd) { margin-right: 8px; }
  </style>
</head>
<body>
  <div class="runner">
    <div class="header">
      <div class="brand">
        <div class="title">TALHA RUNNER</div>
        <div class="version" id="versionText">V2</div>
      </div>
      <div class="update-status" id="updateStatus">● Başlatılıyor</div>
    </div>
    <div class="editor-wrap">
      <textarea id="codeInput" spellcheck="false" placeholder="Yapay zekâdan aldığın InDesign kodunu buraya yapıştır..."></textarea>
    </div>
    <div class="actions">
      <button id="runButton">▶ ÇALIŞTIR</button>
      <button id="clearButton">Temizle</button>
    </div>
    <div class="options">
      <label><input id="clearAfterRun" type="checkbox">Çalıştırınca kodu temizle</label>
    </div>
    <div class="status">
      <span id="statusText">Başlatılıyor...</span>
      <span class="shortcut">Ctrl + Enter</span>
    </div>
    <div class="bottom">
      <button id="saveFavoriteButton">★ Favoriye Kaydet</button>
      <button id="favoritesButton">★ Favorilerim</button>
      <button id="historyButton">Geçmiş</button>
      <button id="updateButton">Güncelle</button>
    </div>
  </div>
  <script src="main.js"></script>
</body>
</html>
